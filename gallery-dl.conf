{
  "extractor": {
    "instagram": {
      "videos": "merged",
      "directory": [],
      "filename": "{post_id}_{num}.{extension}",
      "archive-format": "{post_id}_{num}",
      "sleep-request": [6.0, 12.0],
      "sleep": [0.5, 1.5],
      "postprocessors": [
        {"name": "metadata", "event": "post", "mode": "json", "filename": "{post_id}.json"}
      ]
    }
  }
}
